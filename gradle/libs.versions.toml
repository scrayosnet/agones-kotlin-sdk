[versions]
kotlin = "2.4.21"
ktlint = "1.8.0"
junit = "6.1.3"
kotest = "6.2.7"
protobuf = "4.36.2"
protoc-java = "1.85.1"
protoc-kotlin = "1.5.0"
kotlin-coroutines = "1.11.0"
slf4j = "2.0.20"
log4j = "2.26.1"
kotlinx-serialization = "1.13.0"
testcontainers = "2.0.5"
mockk = "1.14.12"
# transitive dependencies that are only raised through constraints, to leave their vulnerable versions behind
guava = "33.7.2-android"
jackson = "2.23.0"
freemarker = "2.3.35"
logback = "1.6.8"
bouncycastle = "1.87"
lz4 = "1.14.1"
snappy = "1.1.10.12"

[libraries]
protobuf-kotlin = { group = "com.google.protobuf", name = "protobuf-kotlin", version.ref = "protobuf" }
grpc-protobuf = { group = "io.grpc", name = "grpc-protobuf", version.ref = "protoc-java" }
grpc-stub = { group = "io.grpc", name = "grpc-stub", version.ref = "protoc-java" }
grpc-kotlin-stub = { group = "io.grpc", name = "grpc-kotlin-stub", version.ref = "protoc-kotlin" }
grpc-netty = { group = "io.grpc", name = "grpc-netty", version.ref = "protoc-java" }
kotlin-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlin-coroutines" }
kotlin-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlin-coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotest-runner = { group = "io.kotest", name = "kotest-runner-junit5", version.ref = "kotest" }
kotest-testcontainers = { group = "io.kotest", name = "kotest-extensions-testcontainers", version.ref = "kotest" }
kotest-assertions-json = { group = "io.kotest", name = "kotest-assertions-json", version.ref = "kotest" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test" }
slf4j = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
log4j-core = { group = "org.apache.logging.log4j", name = "log4j-core", version.ref = "log4j" }
log4j-slf4j = { group = "org.apache.logging.log4j", name = "log4j-slf4j2-impl", version.ref = "log4j" }
protoc-core = { group = "com.google.protobuf", name = "protoc", version.ref = "protobuf" }
protoc-genJava = { group = "io.grpc", name = "protoc-gen-grpc-java", version.ref = "protoc-java" }
protoc-genKotlin = { group = "io.grpc", name = "protoc-gen-grpc-kotlin", version.ref = "protoc-kotlin" }
testcontainers-core = { group = "org.testcontainers", name = "testcontainers", version.ref = "testcontainers" }
testcontainers-junit = { group = "org.testcontainers", name = "testcontainers-junit-jupiter", version.ref = "testcontainers" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
jackson-core = { group = "com.fasterxml.jackson.core", name = "jackson-core", version.ref = "jackson" }
jackson-databind = { group = "com.fasterxml.jackson.core", name = "jackson-databind", version.ref = "jackson" }
freemarker = { group = "org.freemarker", name = "freemarker", version.ref = "freemarker" }
logback-core = { group = "ch.qos.logback", name = "logback-core", version.ref = "logback" }
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
bouncycastle = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
lz4 = { group = "at.yawk.lz4", name = "lz4-java", version.ref = "lz4" }
snappy = { group = "org.xerial.snappy", name = "snappy-java", version.ref = "snappy" }

[bundles]
kotest = ["kotest-runner", "kotest-testcontainers", "kotest-assertions-json"]
grpc = ["grpc-protobuf", "grpc-stub", "grpc-kotlin-stub"]
testcontainers = ["testcontainers-core", "testcontainers-junit"]
log4j = ["log4j-core", "log4j-slf4j"]

[plugins]
javaLibrary = { id = "org.gradle.java-library" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version = "2.3.0" }
kover = { id = "org.jetbrains.kotlinx.kover", version = "0.9.11" }
protobuf = { id = "com.google.protobuf", version = "0.10.1" }
sonarqube = { id = "org.sonarqube", version = "7.6.0.18749" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version = "14.2.0" }
mavenPublish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
